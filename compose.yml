services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PG_DATA: ${PG_DATA}
    networks:
      - medicitas-network
    volumes:
      - type: volume
        source: medicitas-db-volume
        target: ${PG_VOLUME}
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped
  flyway:
    image: flyway/flyway
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      FLYWAY_URL: jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    command: migrate
    volumes:
      - type: bind
        source: ./DataBaseScript
        target: /flyway/sql
    networks:
      - medicitas-network
    healthcheck:
      test: ["CMD", "flyway", "info"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 5s
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    command: start-dev --import-realm
    volumes:
      - ./services/keycloak:/opt/keycloak/data/import:ro
    networks:
      - medicitas-network
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  #TODO: Agregar Servicio de Redis
  #TODO: Agregar los servicios de application-plane y control-plane utilizando sus imagenes designadas.
volumes:
  medicitas-db-volume:
    name: medicitas-db-volume
networks:
  medicitas-network:
    name: medicitas-network