# =============================================================================
# MediCitas — Docker Compose
# Data plane: PostgreSQL + one-shot database bootstrap + Flyway migrations/seeds.
# Shared plane: RabbitMQ (+ one-shot topology bootstrap), Redis (cache only), Keycloak.
# Domain services: the eight TypeScript services; only the API gateway is published.
# Host ports are bound to 127.0.0.1 only. Containers address each other by service name.
#
#   cp .env.example .env
#   docker compose up --build        (add -d --wait to return once everything is healthy)
# =============================================================================
name: medicitas

# --- Reusable fragments for the domain services ---------------------------------
x-app-healthcheck: &app-healthcheck
  # node:24-slim has no curl/wget: the probe uses Node's fetch against the readiness endpoint.
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 30s

x-app-container: &app-container
  networks:
    - medicitas
  healthcheck: *app-healthcheck
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s
  mem_limit: 256m
  restart: unless-stopped

x-domain-service-deps: &domain-service-deps
  flyway:
    condition: service_completed_successfully
  rabbitmq-bootstrap:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  keycloak:
    condition: service_healthy

x-domain-service: &domain-service
  <<: *app-container
  depends_on: *domain-service-deps

# Variables common to the seven services with a database (shared-plane/runtime serviceEnvSchema).
x-service-env: &service-env
  SERVICE_PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: ${RABBITMQ_VHOST}
  # Keys through the internal name; issuer = the public URL clients obtain tokens from (ADR-0005).
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/medicitas/protocol/openid-connect/certs
  KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/medicitas
  KEYCLOAK_AUDIENCE: medicitas-api

# Keycloak Admin REST API (provisioner service account) for the RF1/RF2 orchestrators.
x-keycloak-admin-env: &keycloak-admin-env
  KEYCLOAK_ADMIN_URL: http://keycloak:8080
  KEYCLOAK_REALM: medicitas
  KEYCLOAK_PROVISIONER_CLIENT_ID: medicitas-provisioner
  KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${MEDICITAS_PROVISIONER_CLIENT_SECRET}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - medicitas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  db-bootstrap:
    image: postgres:18
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TM_DB_OWNER_PASSWORD: ${TM_DB_OWNER_PASSWORD}
      TM_DB_APP_PASSWORD: ${TM_DB_APP_PASSWORD}
      ONB_DB_OWNER_PASSWORD: ${ONB_DB_OWNER_PASSWORD}
      ONB_DB_APP_PASSWORD: ${ONB_DB_APP_PASSWORD}
      UM_DB_OWNER_PASSWORD: ${UM_DB_OWNER_PASSWORD}
      UM_DB_APP_PASSWORD: ${UM_DB_APP_PASSWORD}
      UMO_DB_OWNER_PASSWORD: ${UMO_DB_OWNER_PASSWORD}
      UMO_DB_APP_PASSWORD: ${UMO_DB_APP_PASSWORD}
      CAT_DB_OWNER_PASSWORD: ${CAT_DB_OWNER_PASSWORD}
      CAT_DB_APP_PASSWORD: ${CAT_DB_APP_PASSWORD}
      SCH_DB_OWNER_PASSWORD: ${SCH_DB_OWNER_PASSWORD}
      SCH_DB_APP_PASSWORD: ${SCH_DB_APP_PASSWORD}
      AO_DB_OWNER_PASSWORD: ${AO_DB_OWNER_PASSWORD}
      AO_DB_APP_PASSWORD: ${AO_DB_APP_PASSWORD}
      DB_EVIDENCE_PASSWORD: ${DB_EVIDENCE_PASSWORD}
    volumes:
      - ./database:/bootstrap:ro
    networks:
      - medicitas
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  flyway:
    image: flyway/flyway:13.11.1
    entrypoint: ["/bin/bash", "/flyway/runner/migrate-all.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      TM_DB_OWNER_PASSWORD: ${TM_DB_OWNER_PASSWORD}
      ONB_DB_OWNER_PASSWORD: ${ONB_DB_OWNER_PASSWORD}
      UM_DB_OWNER_PASSWORD: ${UM_DB_OWNER_PASSWORD}
      UMO_DB_OWNER_PASSWORD: ${UMO_DB_OWNER_PASSWORD}
      CAT_DB_OWNER_PASSWORD: ${CAT_DB_OWNER_PASSWORD}
      SCH_DB_OWNER_PASSWORD: ${SCH_DB_OWNER_PASSWORD}
      AO_DB_OWNER_PASSWORD: ${AO_DB_OWNER_PASSWORD}
    volumes:
      - ./database/flyway:/flyway/runner:ro
      - ./database/migrations/common:/flyway/common:ro
      - ./control-plane:/flyway/services/control-plane:ro
      - ./application-plane:/flyway/services/application-plane:ro
    networks:
      - medicitas
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------------------
  # Shared plane
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq # stable Erlang node name, so the data volume is reused across restarts
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - medicitas
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 384m
    restart: unless-stopped

  rabbitmq-bootstrap:
    build:
      context: .
      dockerfile: shared-plane/messaging/Dockerfile
    image: medicitas/rabbitmq-bootstrap:local
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_TM_PASSWORD: ${RABBITMQ_TM_PASSWORD}
      RABBITMQ_ONB_PASSWORD: ${RABBITMQ_ONB_PASSWORD}
      RABBITMQ_UM_PASSWORD: ${RABBITMQ_UM_PASSWORD}
      RABBITMQ_UMO_PASSWORD: ${RABBITMQ_UMO_PASSWORD}
      RABBITMQ_CAT_PASSWORD: ${RABBITMQ_CAT_PASSWORD}
      RABBITMQ_SCH_PASSWORD: ${RABBITMQ_SCH_PASSWORD}
      RABBITMQ_AO_PASSWORD: ${RABBITMQ_AO_PASSWORD}
    networks:
      - medicitas
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8.8.3-alpine
    # Cache only (ADR-0008): no persistence, bounded memory, LRU eviction. ACL users (no default user):
    #   scheduler   — availability keys only, cache commands only
    #   healthcheck — PING only
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --user
      - default
      - "off"
      - --user
      - scheduler
      - "on"
      - ">${REDIS_SCHEDULER_PASSWORD}"
      - "~availability:*"
      - resetchannels
      - "-@all"
      - "+@connection"
      - "+get"
      - "+set"
      - "+del"
      - "+mget"
      - "+sadd"
      - "+smembers"
      - "+expire"
      - "+multi"
      - "+exec"
      - "+discard"
      - --user
      - healthcheck
      - "on"
      - ">${REDIS_HEALTHCHECK_PASSWORD}"
      - resetchannels
      - "-@all"
      - "+ping"
      - "+auth"
      - "+hello"
    environment:
      REDIS_HEALTHCHECK_PASSWORD: ${REDIS_HEALTHCHECK_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - medicitas
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user healthcheck --pass \"$${REDIS_HEALTHCHECK_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Tokens always carry the public issuer; services fetch keys through the internal name (ADR-0005).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Heap capped at 50% of mem_limit so metaspace/native memory never push the JVM over the limit.
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"
      # Resolved by the realm import placeholders; never written into the repository.
      MEDICITAS_PROVISIONER_CLIENT_SECRET: ${MEDICITAS_PROVISIONER_CLIENT_SECRET}
      MEDICITAS_DEMO_USER_PASSWORD: ${MEDICITAS_DEMO_USER_PASSWORD}
      MEDICITAS_PLATFORM_ADMIN_PASSWORD: ${MEDICITAS_PLATFORM_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      # Named volume on the image's data directory (inherits the keycloak user's ownership);
      # the versioned realm is bind-mounted read-only inside it.
      - keycloak-data:/opt/keycloak/data
      - ./shared-plane/identity/keycloak:/opt/keycloak/data/import:ro
    networks:
      - medicitas
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Domain services (Stage 5). One image per service (multi-stage, non-root, read-only root
  # filesystem). Only the API gateway publishes a host port; every other service is reachable
  # only inside the medicitas network, by service name. One replica each (RAM budget; the
  # RF1/RF2 orchestrators also keep temporary passwords in memory, decision-log S4-10).
  # ---------------------------------------------------------------------------
  tenant-management:
    <<: *domain-service
    build:
      context: .
      dockerfile: control-plane/tenant-management/Dockerfile
    image: medicitas/tenant-management:local
    environment:
      <<: *service-env
      DB_NAME: medicitas_tenant
      DB_USER: tm_app
      DB_PASSWORD: ${TM_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_TM_PASSWORD}

  onboarding-orchestrator:
    <<: *domain-service
    build:
      context: .
      dockerfile: control-plane/onboarding-orchestrator/Dockerfile
    image: medicitas/onboarding-orchestrator:local
    environment:
      <<: [*service-env, *keycloak-admin-env]
      DB_NAME: medicitas_onboarding
      DB_USER: onb_app
      DB_PASSWORD: ${ONB_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_ONB_PASSWORD}

  user-management:
    <<: *domain-service
    build:
      context: .
      dockerfile: application-plane/user-management/Dockerfile
    image: medicitas/user-management:local
    environment:
      <<: *service-env
      DB_NAME: medicitas_user
      DB_USER: um_app
      DB_PASSWORD: ${UM_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_UM_PASSWORD}

  user-management-orchestrator:
    <<: *domain-service
    build:
      context: .
      dockerfile: application-plane/user-management-orchestrator/Dockerfile
    image: medicitas/user-management-orchestrator:local
    environment:
      <<: [*service-env, *keycloak-admin-env]
      DB_NAME: medicitas_user_orchestrator
      DB_USER: umo_app
      DB_PASSWORD: ${UMO_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_UMO_PASSWORD}

  catalog-service-management:
    <<: *domain-service
    build:
      context: .
      dockerfile: application-plane/catalog-service-management/Dockerfile
    image: medicitas/catalog-service-management:local
    environment:
      <<: *service-env
      DB_NAME: medicitas_catalog
      DB_USER: cat_app
      DB_PASSWORD: ${CAT_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_CAT_PASSWORD}

  scheduler-management:
    <<: *domain-service
    build:
      context: .
      dockerfile: application-plane/scheduler-management/Dockerfile
    image: medicitas/scheduler-management:local
    environment:
      <<: *service-env
      DB_NAME: medicitas_scheduler
      DB_USER: sch_app
      DB_PASSWORD: ${SCH_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_SCH_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: scheduler
      REDIS_PASSWORD: ${REDIS_SCHEDULER_PASSWORD}
      AVAILABILITY_CACHE_ENABLED: ${AVAILABILITY_CACHE_ENABLED:-true}
      AVAILABILITY_CACHE_TTL_SECONDS: ${AVAILABILITY_CACHE_TTL_SECONDS:-300}
    depends_on:
      <<: *domain-service-deps
      redis:
        condition: service_healthy

  appointment-orchestrator:
    <<: *domain-service
    build:
      context: .
      dockerfile: application-plane/appointment-orchestrator/Dockerfile
    image: medicitas/appointment-orchestrator:local
    environment:
      <<: *service-env
      DB_NAME: medicitas_appointment_orchestrator
      DB_USER: ao_app
      DB_PASSWORD: ${AO_DB_APP_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_AO_PASSWORD}

  api-gateway:
    <<: *app-container
    build:
      context: .
      dockerfile: application-plane/api-gateway/Dockerfile
    image: medicitas/api-gateway:local
    environment:
      SERVICE_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/medicitas/protocol/openid-connect/certs
      KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/medicitas
      KEYCLOAK_AUDIENCE: medicitas-api
      UPSTREAM_TIMEOUT_MS: "20000"
      TENANT_MANAGEMENT_URL: http://tenant-management:3000
      ONBOARDING_ORCHESTRATOR_URL: http://onboarding-orchestrator:3000
      USER_MANAGEMENT_URL: http://user-management:3000
      USER_MANAGEMENT_ORCHESTRATOR_URL: http://user-management-orchestrator:3000
      CATALOG_SERVICE_URL: http://catalog-service-management:3000
      SCHEDULER_URL: http://scheduler-management:3000
      APPOINTMENT_ORCHESTRATOR_URL: http://appointment-orchestrator:3000
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8000"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    mem_limit: 192m
    depends_on:
      keycloak:
        condition: service_healthy
      tenant-management:
        condition: service_healthy
      onboarding-orchestrator:
        condition: service_healthy
      user-management:
        condition: service_healthy
      user-management-orchestrator:
        condition: service_healthy
      catalog-service-management:
        condition: service_healthy
      scheduler-management:
        condition: service_healthy
      appointment-orchestrator:
        condition: service_healthy

volumes:
  postgres-data:
    name: medicitas-postgres-data
  rabbitmq-data:
    name: medicitas-rabbitmq-data
  keycloak-data:
    name: medicitas-keycloak-data

networks:
  medicitas:
    name: medicitas-network
